version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veridt_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - veridt-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: veridt_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - veridt-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridt_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - MAIL_FROM=${MAIL_FROM:-no-reply@veridt.local}
      - MAIL_THREADS=${MAIL_THREADS:-2}
      - MAIL_SENSITIVE_CLEANUP_INTERVAL=${MAIL_SENSITIVE_CLEANUP_INTERVAL:-PT5M}
      - RESET_URL=${RESET_URL:-http://localhost:8080/redefinir-senha}
      - RESET_TOKEN_VALIDITY=${RESET_TOKEN_VALIDITY:-15m}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-8}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - veridt-net

volumes:
  postgres_data:

networks:
  veridt-net:
    driver: bridge