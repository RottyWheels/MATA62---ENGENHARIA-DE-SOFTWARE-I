spring.application.name=Veridt
spring.config.import=optional:file:.env[.properties]
spring.modulith.detection-strategy=explicitly-annotated
spring.docker.compose.start.arguments=postgres,mailpit

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.modulith.events.republish-outstanding-events-on-restart=true
veridt.mail.from=${MAIL_FROM:no-reply@veridt.local}
veridt.mail.threads=2

# Mantém o executor padrão do Spring mesmo com o executor exclusivo da notificação registrado.
spring.task.execution.mode=force
