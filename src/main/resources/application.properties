spring.application.name=Veridt
spring.config.import=optional:file:.env[.properties]
spring.modulith.detection-strategy=explicitly-annotated
spring.docker.compose.start.arguments=postgres,mailpit

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.modulith.events.republish-outstanding-events-on-restart=true
veridt.mail.from=${MAIL_FROM:no-reply@veridt.local}
veridt.mail.threads=${MAIL_THREADS:2}
# Intervalo da limpeza de e-mails sensíveis já enviados (ISO-8601).
veridt.mail.sensitive-cleanup-interval=${MAIL_SENSITIVE_CLEANUP_INTERVAL:PT5M}

# As tabelas do Spring Session vêm da migration V1.
spring.session.jdbc.initialize-schema=never

veridt.identity.reset-token-validity=${RESET_TOKEN_VALIDITY:15m}
veridt.identity.reset-url=${RESET_URL:http://localhost:8080/redefinir-senha}
veridt.identity.password-min-length=${PASSWORD_MIN_LENGTH:8}

# Mantém o executor padrão do Spring mesmo com o executor exclusivo da notificação registrado.
spring.task.execution.mode=force
